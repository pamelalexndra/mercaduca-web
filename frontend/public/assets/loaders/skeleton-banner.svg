<svg width="800" height="400" viewBox="0 0 800 400" xmlns="http://www.w3.org/2000/svg">
<defs>
<linearGradient id="shimmer">
<stop offset="0%" stop-color="#e9ecef"/>
<stop offset="50%" stop-color="#f4f4f2"/>
<stop offset="100%" stop-color="#e9ecef"/>
</linearGradient>
</defs>
<rect width="800" height="400" rx="25" fill="url(#shimmer)">
<animate attributeName="x" from="-800" to="800" dur="1.8s" repeatCount="indefinite"/>
</rect>
</svg>