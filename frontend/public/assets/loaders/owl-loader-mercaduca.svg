<svg width="160" height="160" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
<style>
@keyframes pulse {
  0% { transform: scale(0.95); opacity: 0.85; }
  50% { transform: scale(1); opacity: 1; }
  100% { transform: scale(0.95); opacity: 0.85; }
}
.owl { transform-origin: center; animation: pulse 1.6s ease-in-out infinite; }
</style>
<g class="owl">
<ellipse cx="100" cy="115" rx="55" ry="65" fill="#557051"/>
<ellipse cx="100" cy="95" rx="45" ry="45" fill="#ffffff"/>
<circle cx="80" cy="90" r="15" fill="#222"/>
<circle cx="120" cy="90" r="15" fill="#222"/>
<circle cx="75" cy="85" r="4" fill="#fff"/>
<circle cx="115" cy="85" r="4" fill="#fff"/>
<polygon points="95,105 105,105 100,115" fill="#222"/>
</g>
</svg>